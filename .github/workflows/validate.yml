name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install aiohttp

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for root in ("custom_components", "tests"):
              for path in Path(root).rglob("*.py"):
                  ast.parse(path.read_text(), filename=str(path))
          PY

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/xplora_kids/manifest.json > /dev/null
          python -m json.tool custom_components/xplora_kids/strings.json > /dev/null
          python -m json.tool custom_components/xplora_kids/translations/en.json > /dev/null
          python -m json.tool custom_components/xplora_kids/translations/de.json > /dev/null
          python -m json.tool hacs.json > /dev/null
